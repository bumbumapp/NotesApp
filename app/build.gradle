apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_INTERSTITIAL_ID=... / ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsPropsFile = rootProject.file('ads.properties')
if (hmsAdsPropsFile.exists()) hmsAdsPropsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_BANNER_ID = hmsAdId('HMS_BANNER_ID', 'w8yiyaxv35')
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', 'x0u5x98qg0')

android {
    namespace 'com.bumbumapps.mynotes'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.notes"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "1.5.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'admob_app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'banner_id', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'interstitial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app for com.bumbumapps.notes).
            resValue 'string', 'admob_app_id', 'ca-app-pub-8444865753152507~4557270068'
            resValue 'string', 'banner_id', 'ca-app-pub-8444865753152507/8767977814'
            resValue 'string', 'interstitial_id', 'ca-app-pub-8444865753152507/8521044739'
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation 'commons-io:commons-io:2.4'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
